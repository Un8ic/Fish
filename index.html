<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой аквариум</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="aquarium-page">
        <div class="header">
            <h1>Твой аквариум</h1>
        </div>
        
        <div id="aquarium"></div>
        
        <button id="backBtn">Назад</button>
        <button id="feedBtn">Покормить рыбок</button>
        
        <div class="info">
            Кликните/коснитесь в любом месте аквариума, чтобы напугать рыбок
        </div>
        
        <div class="footer">
            Наслаждайтесь видом плавающих рыбок!
        </div>
    </div>

    <script src="aquarium.js"></script>
</body>
</html>
