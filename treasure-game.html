<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подводный сборщик сокровищ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #1a2980, #26d0ce);
            padding: 10px;
            box-sizing: border-box;
        }
        
        #game-canvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: linear-gradient(to bottom, #2e86ab, #1b4f72);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        
        #backBtn {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 10px 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 10;
        }
        
        #restartBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 10;
            display: none;
        }
        
        .game-info {
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }
        
        .controls {
            color: white;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            padding: 0 10px;
        }

        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }

        .mobile-btn {
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            min-width: 60px;
        }

        @media (max-width: 768px) {
            #game-canvas {
                width: 100%;
                max-height: 60vh;
            }
            
            .game-info {
                font-size: 14px;
            }
            
            .controls {
                font-size: 12px;
            }

            .mobile-controls {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .direction-buttons {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
                margin-bottom: 10px;
            }

            .direction-buttons button:nth-child(1) {
                grid-column: 2;
            }

            .direction-buttons button:nth-child(2) {
                grid-column: 1;
                grid-row: 2;
            }

            .direction-buttons button:nth-child(3) {
                grid-column: 2;
                grid-row: 2;
            }

            .direction-buttons button:nth-child(4) {
                grid-column: 3;
                grid-row: 2;
            }
        }

        @media (max-width: 480px) {
            #backBtn, #restartBtn {
                top: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .game-info {
                font-size: 12px;
            }
            
            .mobile-btn {
                padding: 12px 16px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <button id="backBtn">Назад</button>
        <button id="restartBtn">Перезапустить</button>
        <div class="game-info" id="control-info">Загрузка...</div>
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div class="controls" id="restart-info"></div>
        
        <div class="mobile-controls">
            <div class="direction-buttons">
                <button class="mobile-btn" id="upBtn">↑</button>
                <button class="mobile-btn" id="leftBtn">←</button>
                <button class="mobile-btn" id="downBtn">↓</button>
                <button class="mobile-btn" id="rightBtn">→</button>
            </div>
        </div>
    </div>

    <script src="treasure-game.js"></script>
</body>
</html>
